<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enterprise GIS Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: radial-gradient(circle at top, #f4faf8, #e7f1ee 65%, #dbe7e2);
        color: #14342f;
      }

      main {
        width: min(92vw, 560px);
        background: #ffffffcc;
        border: 1px solid #c8ddd5;
        border-radius: 14px;
        padding: 22px 20px;
        box-shadow: 0 10px 35px rgba(17, 69, 57, 0.08);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.2rem;
      }

      p {
        margin: 0;
        line-height: 1.45;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Offline Mode</h1>
      <p>
        Enterprise GIS shell is cached. Reconnect to sync edits, search places, and refresh layers from the API.
      </p>
    </main>
  </body>
</html>
